[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-qk-waft"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "diffusers==0.35.2",
  "transformers>=4.51",
  "accelerate>=1.2",
  "peft>=0.14",
  "safetensors>=0.4",
  "timm==1.0.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
